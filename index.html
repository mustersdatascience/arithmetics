<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Rekenen">
<meta name="theme-color" content="#EEEFF2">
<title>Rekentrainer</title>
<style>
:root{
  --bg:#EEEFF2; --panel:#FFFFFF; --ink:#12151A; --muted:#6B7280;
  --accent:#2B5CE6; --ok:#0F8A5F; --bad:#C2352E; --line:#D6D9E0; --sunk:#E4E6EB;
  --warm:#B8621B;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0F1216; --panel:#171B21; --ink:#E7EAEE; --muted:#8A94A3;
    --accent:#6B8CFF; --ok:#34C38F; --bad:#FF6B63; --line:#262C34; --sunk:#11151A;
    --warm:#E0913F;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:16px; line-height:1.5;
  -webkit-text-size-adjust:100%;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
.wrap{max-width:640px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:19px;font-weight:600;letter-spacing:-.01em}
h2{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:26px 0 10px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:4px}
.sub{color:var(--muted);font-size:13px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.card + .card{margin-top:10px}

/* setup */
.preset-row{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:999px;
  padding:7px 13px;font-size:13px;cursor:pointer;font-family:inherit}
.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.mode-head{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.mode-head input{width:18px;height:18px;accent-color:var(--accent);flex:none}
.mode-name{font-weight:500;flex:1}
.mode-hint{font-size:12px;color:var(--muted)}
.fields{display:none;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.card.on .fields{display:block}
.frow{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:13px}
.frow label{flex:1;color:var(--muted)}
input[type=number],select{
  background:var(--sunk);border:1px solid var(--line);color:var(--ink);
  border-radius:7px;padding:7px 8px;font-size:16px;font-family:ui-monospace,monospace;
  width:76px;text-align:center;-moz-appearance:textfield}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
select{width:auto;min-width:96px;font-family:inherit;font-size:14px}
input[type=email],input[type=password]{
  background:var(--sunk);border:1px solid var(--line);color:var(--ink);
  border-radius:7px;padding:11px 12px;font-size:16px;font-family:inherit;width:100%}
.dash{color:var(--muted)}
.settings .frow label{flex:1}
.btn{display:block;width:100%;background:var(--accent);color:#fff;border:none;border-radius:11px;
  padding:15px;font-size:16px;font-weight:600;font-family:inherit;cursor:pointer;margin-top:18px}
.btn:active{opacity:.85}
.btn:disabled{opacity:.5}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);font-weight:500;margin-top:8px}
.linkrow{display:flex;gap:16px;justify-content:center;margin-top:18px;flex-wrap:wrap}
.link{background:none;border:none;color:var(--muted);font-size:13px;text-decoration:underline;
  cursor:pointer;font-family:inherit;padding:4px}
.err{color:var(--bad);font-size:13px;text-align:center;margin-top:10px;min-height:18px}
.note{font-size:13px;color:var(--muted);margin-top:10px;text-align:center;min-height:18px}

/* status */
.status{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}
.dot.off{background:var(--muted)}
.dot.pending{background:var(--warm)}

/* session */
#session{display:none}
.bar{position:relative;height:6px;background:var(--sunk);border-radius:3px;overflow:hidden;margin-bottom:8px}
#fill{position:absolute;inset:0 auto 0 0;background:var(--accent);width:100%}
.tick{position:absolute;top:0;bottom:0;width:2px;background:var(--ink);opacity:.55}
.tick.bad{background:var(--bad);opacity:1}
.hud{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:34px}
.tag{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--warm)}
.q{font-size:clamp(38px,11vw,58px);font-weight:500;text-align:center;letter-spacing:-.02em;min-height:1.2em}
.a{font-size:clamp(30px,9vw,44px);text-align:center;color:var(--accent);min-height:1.3em;margin-top:6px}
.a.bad{color:var(--bad)}
.flash{font-size:14px;text-align:center;color:var(--bad);min-height:20px;margin-top:2px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:26px}
.key{background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:11px;
  padding:17px 0;font-size:22px;font-family:ui-monospace,monospace;cursor:pointer;
  -webkit-tap-highlight-color:transparent;user-select:none}
.key:active{background:var(--accent);color:#fff;border-color:var(--accent)}
.key.ok{grid-column:span 3;font-family:inherit;font-size:17px;font-weight:600;padding:14px 0}

/* Alle schermen staan uit tot app.js er een aanzet. Laadt de app niet, dan
   blijft #boot staan en meldt het inline scriptje onderaan wat er mis is. */
#setup,#results,#stats,#auth{display:none}
.big{display:flex;gap:10px;margin:14px 0}
.stat{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:12px;text-align:center}
.stat .v{font-size:26px;font-weight:600;font-family:ui-monospace,monospace}
.stat .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:2px}
.strip{display:flex;align-items:flex-end;gap:2px;height:86px;padding:10px;background:var(--panel);
  border:1px solid var(--line);border-radius:11px;overflow-x:auto}
.strip i{flex:1 0 5px;min-width:5px;background:var(--accent);border-radius:2px 2px 0 0;display:block}
.strip i.bad{background:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
  font-weight:600;padding:0 0 6px}
td{padding:7px 0;border-top:1px solid var(--line);font-family:ui-monospace,monospace}
td:last-child,th:last-child{text-align:right}
.empty{color:var(--muted);font-size:14px;padding:14px 0;text-align:center}
.warm{color:var(--warm)}
tr.wrong td{color:var(--bad)}
tr.skipped td{color:var(--muted)}
td.ans{color:var(--muted)}
tr.wrong td.ans{color:var(--bad)}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}

/* Terugknop blijft in beeld, ook als je ver naar beneden gescrold bent. */
.backbar{position:sticky;top:0;z-index:5;background:var(--bg);padding:6px 0 10px}

/* filterpaneel op het statistiekenscherm */
.ctl{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.ctl select{flex:1;min-width:0}
.panel{display:none;margin-bottom:10px}
.panel.open{display:block}
.chip.del{padding:7px 9px;color:var(--muted)}
.chip.del:hover{border-color:var(--bad);color:var(--bad)}

/* sessieoverzicht */
.sess{background:var(--panel);border:1px solid var(--line);border-radius:11px;
  padding:12px;margin-bottom:8px}
.sess .when{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted)}
.sess .what{margin:5px 0;font-size:14px}
.sess .what span{display:block;font-family:ui-monospace,monospace;font-size:13px}
.sess .nums{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}

/* heatmap */
.heat{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:10px}
.heat table{border-collapse:separate;border-spacing:2px;width:auto;margin:0 auto}
.heat td,.heat th{padding:0;border:none;font-family:ui-monospace,monospace;font-size:10px;
  color:var(--muted);text-align:center}
.heat th{width:17px;height:17px}
.heat td i{display:block;width:17px;height:17px;border-radius:3px;background:var(--sunk)}
.legend{display:flex;align-items:center;gap:6px;justify-content:center;margin-top:8px;
  font-size:11px;color:var(--muted)}
.legend i{display:block;width:16px;height:10px;border-radius:2px}
</style>
</head>
<body>
<div class="wrap">

<section id="boot"><p class="sub" id="bootMsg">Laden...</p></section>

<!-- ============ INLOGGEN ============ -->
<section id="auth">
  <div class="top"><h1>Rekentrainer</h1></div>
  <p class="sub">Log in zodat je oefengeschiedenis op al je apparaten hetzelfde is.</p>
  <div class="card" style="margin-top:16px">
    <div class="frow"><input type="email" id="email" placeholder="e-mailadres" autocomplete="username"></div>
    <div class="frow"><input type="password" id="pw" placeholder="wachtwoord" autocomplete="current-password"></div>
  </div>
  <button class="btn" id="doLogin">Inloggen</button>
  <button class="btn ghost" id="doSignup">Account aanmaken</button>
  <p class="err" id="authErr"></p>
  <p class="note" id="authNote"></p>
</section>

<!-- ============ SETUP ============ -->
<section id="setup">
  <div class="top"><h1>Rekentrainer</h1><span class="sub" id="totalDone"></span></div>
  <div class="status"><span class="dot" id="syncDot"></span><span id="syncText"></span></div>

  <h2>Presets</h2>
  <div class="preset-row" id="presets"></div>
  <button class="link" id="savePreset" style="margin-top:8px">Huidige instelling opslaan als preset</button>

  <h2>Oefeningen</h2>
  <div id="modes"></div>

  <h2>Instellingen</h2>
  <div class="card settings">
    <div class="frow">
      <label for="dur">Sessieduur</label>
      <select id="dur">
        <option value="30">30 sec</option>
        <option value="60">60 sec</option>
        <option value="120" selected>120 sec</option>
        <option value="300">5 min</option>
        <option value="0">geen limiet</option>
      </select>
    </div>
    <div class="frow">
      <label for="weighted">Zwakke sommen vaker herhalen</label>
      <select id="weighted"><option value="1" selected>aan</option><option value="0">uit</option></select>
    </div>
    <div class="frow">
      <label for="auto">Doorgaan zodra het antwoord klopt</label>
      <select id="auto"><option value="1" selected>aan</option><option value="0">uit, met enter</option></select>
    </div>
    <div class="frow">
      <label for="tol">Decimalen goedrekenen</label>
      <select id="tol">
        <option value="d1">op 1 decimaal</option>
        <option value="d2">op 2 decimalen</option>
        <option value="d3">op 3 decimalen</option>
        <option value="d4">op 4 decimalen</option>
        <option value="0">exact</option>
        <option value="0.5">0,5 procent marge</option>
        <option value="1" selected>1 procent marge</option>
        <option value="2">2 procent marge</option>
        <option value="5">5 procent marge</option>
      </select>
    </div>
    <div class="frow">
      <label for="pad">Toetsenblok op het scherm</label>
      <select id="pad"><option value="auto" selected>automatisch</option><option value="1">altijd</option><option value="0">nooit</option></select>
    </div>
  </div>

  <button class="btn" id="start">Beginnen</button>
  <button class="btn ghost" id="drill">Stampen: alleen je zwakste sommen</button>
  <p class="err" id="setupErr"></p>
  <div class="linkrow">
    <button class="link" id="toStats">Statistieken</button>
    <button class="link" id="doImport">Oude data overnemen</button>
    <button class="link" id="doExport">Exporteren</button>
    <button class="link" id="doLogout">Uitloggen</button>
  </div>
</section>

<!-- ============ SESSIE ============ -->
<section id="session">
  <div class="bar"><div id="fill"></div></div>
  <div class="hud">
    <span class="mono" id="clock">120</span>
    <span class="tag" id="srsTag"></span>
    <span class="mono" id="score">0</span>
  </div>
  <div class="q mono" id="q"></div>
  <div class="a mono" id="a"></div>
  <div class="sub" id="hint" style="text-align:center;min-height:20px"></div>
  <div class="flash" id="flash"></div>
  <div class="pad" id="keypad"></div>
  <button class="btn ghost" id="stop">Stoppen</button>
</section>

<!-- ============ RESULTAAT ============ -->
<section id="results">
  <div class="top"><h1>Klaar</h1><span class="sub" id="pb"></span></div>
  <div class="big">
    <div class="stat"><div class="v" id="rGoed">0</div><div class="l">goed</div></div>
    <div class="stat"><div class="v" id="rTempo">0</div><div class="l">per minuut</div></div>
    <div class="stat"><div class="v" id="rAcc">0%</div><div class="l">accuraat</div></div>
  </div>
  <h2>Ritme</h2>
  <div class="strip" id="strip"></div>
  <p class="sub" style="margin-top:6px">Elke balk is een som. Hoger is trager. Rood is fout.</p>
  <div id="rMistakes"></div>
  <h2>Alle sommen</h2>
  <div class="ctl"><button class="chip" id="rSort">traagste eerst</button></div>
  <div class="card"><div id="rAll"></div></div>
  <p class="note" id="rSync"></p>
  <button class="btn" id="again">Nog een keer</button>
  <button class="btn ghost" id="back">Terug naar instellingen</button>
</section>

<!-- ============ STATISTIEKEN ============ -->
<section id="stats">
  <div class="backbar"><button class="chip" id="sBack">← Terug</button></div>
  <div class="top"><h1>Statistieken</h1><span class="sub" id="sCount"></span></div>
  <div class="tabs" id="sTabs"></div>
  <div id="sControls"></div>
  <div id="sBody"></div>
</section>

</div>
<script type="module" src="./app.js"></script>
<script>
// Vangnet: als de module niet laadt zie je waarom, in plaats van een leeg scherm.
setTimeout(function () {
  if (!window.__rtReady) {
    document.getElementById('bootMsg').textContent =
      'De app kon niet laden. Ververs de pagina; blijft dit staan, dan ontbreekt er een bestand.';
  }
}, 6000);
</script>
</body>
</html>
